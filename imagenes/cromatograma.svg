<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" role="img" aria-labelledby="t d"><title id="t">Cromatograma ilustrativo</title><desc id="d">Señal del detector en función del tiempo con dos picos separados, tR1 y tR2, y línea base.</desc><rect width="900" height="440" rx="24" fill="#fbf8fd"/><text x="54" y="52" font-family="Arial" font-size="25" font-weight="700" fill="#4a2d60">Cromatograma: señal frente al tiempo</text><path d="M90 340 H830 M90 340 V95" stroke="#51445b" stroke-width="3" fill="none"/><path d="M90 340 C190 340 205 337 230 330 C260 318 270 175 305 150 C340 125 360 318 390 330 C430 340 490 340 530 330 C560 315 580 125 620 105 C660 85 675 315 710 330 C740 340 785 340 830 340" fill="none" stroke="#7a4b9b" stroke-width="6"/><path d="M305 340 V150 M620 340 V105" stroke="#c59b42" stroke-width="2.5" stroke-dasharray="8 7"/><path d="M90 340 H830" stroke="#9b8ca5" stroke-width="1.5"/><text x="55" y="105" font-family="Arial" font-size="18" fill="#51445b" transform="rotate(-90 55 105)">Respuesta del detector</text><text x="450" y="395" text-anchor="middle" font-family="Arial" font-size="20" fill="#51445b">Tiempo (min)</text><text x="305" y="130" text-anchor="middle" font-family="Arial" font-size="20" font-weight="700" fill="#65358a">Pico 1</text><text x="620" y="82" text-anchor="middle" font-family="Arial" font-size="20" font-weight="700" fill="#65358a">Pico 2</text><text x="305" y="370" text-anchor="middle" font-family="Arial" font-size="18" fill="#51445b">tR₁</text><text x="620" y="370" text-anchor="middle" font-family="Arial" font-size="18" fill="#51445b">tR₂</text><text x="102" y="365" font-family="Arial" font-size="15" fill="#716779">0</text></svg>