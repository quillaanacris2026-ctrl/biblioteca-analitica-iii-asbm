<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" role="img" aria-labelledby="t d"><title id="t">Esquema conceptual de un fotómetro STAT FAX</title><desc id="d">Representación didáctica de pantalla, panel de control, compartimiento de cubeta y sistema óptico; no es plano técnico del modelo.</desc><rect width="900" height="430" rx="24" fill="#fbf8fd"/><text x="45" y="48" font-family="Arial" font-size="25" font-weight="700" fill="#4a2d60">Elementos funcionales del fotómetro</text><rect x="210" y="100" width="480" height="250" rx="26" fill="#e8e2eb" stroke="#6d5a78" stroke-width="4"/><rect x="260" y="140" width="205" height="92" rx="10" fill="#dcebe8" stroke="#548c75" stroke-width="3"/><text x="362" y="177" text-anchor="middle" font-family="Arial" font-size="20" font-weight="700" fill="#315e4e">Pantalla</text><text x="362" y="205" text-anchor="middle" font-family="Arial" font-size="15" fill="#315e4e">lectura / método</text><rect x="500" y="140" width="135" height="92" rx="10" fill="#eee5f5" stroke="#8b5bb2" stroke-width="3"/><g fill="#8b5bb2"><circle cx="530" cy="168" r="9"/><circle cx="565" cy="168" r="9"/><circle cx="600" cy="168" r="9"/><circle cx="530" cy="202" r="9"/><circle cx="565" cy="202" r="9"/><circle cx="600" cy="202" r="9"/></g><text x="568" y="258" text-anchor="middle" font-family="Arial" font-size="16" fill="#51445b">Panel de control</text><rect x="330" y="278" width="240" height="40" rx="8" fill="#fff3d9" stroke="#c59b42" stroke-width="3"/><text x="450" y="304" text-anchor="middle" font-family="Arial" font-size="17" fill="#72521b">Compartimiento de lectura</text><g stroke="#65358a" stroke-width="2.5" fill="none"><path d="M210 155 H110 V120 H65 M690 155 H780 V120 H840 M450 350 V385 H840"/></g><g font-family="Arial" font-size="16" fill="#51445b"><text x="65" y="95">Visualización</text><text x="720" y="95">Selección de método</text><text x="580" y="410">Cubeta / tubo de reacción</text></g><text x="450" y="78" text-anchor="middle" font-family="Arial" font-size="14" fill="#8a718f">Esquema didáctico, no a escala ni sustituto del manual del fabricante</text></svg>