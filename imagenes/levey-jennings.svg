<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 450" role="img" aria-labelledby="t d"><title id="t">Gráfico ilustrativo de Levey-Jennings</title><desc id="d">Línea central de media y límites de una, dos y tres desviaciones estándar con resultados de control alrededor de la media.</desc><rect width="900" height="450" rx="24" fill="#fbf8fd"/><text x="45" y="48" font-family="Arial" font-size="25" font-weight="700" fill="#4a2d60">Gráfico de Levey–Jennings (ejemplo)</text><path d="M95 90 V355 H840" fill="none" stroke="#51445b" stroke-width="3"/><g stroke-width="2.5" stroke-dasharray="8 6"><path d="M95 115 H840" stroke="#bd6a6a"/><path d="M95 155 H840" stroke="#d2a04b"/><path d="M95 195 H840" stroke="#9b83ad"/><path d="M95 235 H840" stroke="#548c75" stroke-dasharray="none" stroke-width="3"/><path d="M95 275 H840" stroke="#9b83ad"/><path d="M95 315 H840" stroke="#d2a04b"/><path d="M95 355 H840" stroke="#bd6a6a"/></g><g font-family="Arial" font-size="16" fill="#51445b"><text x="48" y="120">+3 DE</text><text x="48" y="160">+2 DE</text><text x="48" y="200">+1 DE</text><text x="48" y="240">Media</text><text x="48" y="280">−1 DE</text><text x="48" y="320">−2 DE</text><text x="48" y="360">−3 DE</text><text x="470" y="410" text-anchor="middle">Secuencia de controles</text></g><polyline points="130,242 205,224 280,253 355,215 430,231 505,188 580,205 655,230 730,176 805,195" fill="none" stroke="#65358a" stroke-width="4"/><g fill="#65358a" stroke="white" stroke-width="3"><circle cx="130" cy="242" r="8"/><circle cx="205" cy="224" r="8"/><circle cx="280" cy="253" r="8"/><circle cx="355" cy="215" r="8"/><circle cx="430" cy="231" r="8"/><circle cx="505" cy="188" r="8"/><circle cx="580" cy="205" r="8"/><circle cx="655" cy="230" r="8"/><circle cx="730" cy="176" r="8"/><circle cx="805" cy="195" r="8"/></g><text x="470" y="438" text-anchor="middle" font-family="Arial" font-size="13" fill="#716779">Datos simulados únicamente para explicar la lectura del gráfico.</text></svg>