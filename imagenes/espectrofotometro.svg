<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img" aria-labelledby="t d"><title id="t">Esquema del recorrido óptico de un espectrofotómetro</title><desc id="d">Fuente de luz, selector de longitud de onda, cubeta con muestra y detector conectados en secuencia.</desc><rect width="900" height="400" rx="24" fill="#fbf8fd"/><text x="45" y="48" font-family="Arial" font-size="25" font-weight="700" fill="#4a2d60">Recorrido óptico básico</text><g font-family="Arial" text-anchor="middle"><rect x="45" y="135" width="155" height="115" rx="16" fill="#eee5f5" stroke="#8b5bb2" stroke-width="3"/><text x="122" y="182" font-size="20" font-weight="700" fill="#4a2d60">Fuente</text><text x="122" y="211" font-size="16" fill="#51445b">de radiación</text><rect x="265" y="135" width="155" height="115" rx="16" fill="#eee5f5" stroke="#8b5bb2" stroke-width="3"/><text x="342" y="182" font-size="20" font-weight="700" fill="#4a2d60">Selector</text><text x="342" y="211" font-size="16" fill="#51445b">λ / filtro</text><rect x="485" y="135" width="155" height="115" rx="16" fill="#fff3d9" stroke="#c59b42" stroke-width="3"/><text x="562" y="182" font-size="20" font-weight="700" fill="#4a2d60">Cubeta</text><text x="562" y="211" font-size="16" fill="#51445b">con muestra</text><rect x="705" y="135" width="150" height="115" rx="16" fill="#e8f2ee" stroke="#548c75" stroke-width="3"/><text x="780" y="182" font-size="20" font-weight="700" fill="#315e4e">Detector</text><text x="780" y="211" font-size="16" fill="#315e4e">y lectura</text></g><g stroke="#65358a" stroke-width="5" fill="none"><path d="M200 192 H260 M420 192 H480 M640 192 H700"/><path d="M248 181 L260 192 L248 203 M468 181 L480 192 L468 203 M688 181 L700 192 L688 203"/></g><path d="M45 292 H855" stroke="#d9cde1" stroke-width="2" stroke-dasharray="7 7"/><text x="450" y="335" text-anchor="middle" font-family="Arial" font-size="18" fill="#716779">La absorbancia se relaciona con la concentración dentro del intervalo lineal del método.</text></svg>